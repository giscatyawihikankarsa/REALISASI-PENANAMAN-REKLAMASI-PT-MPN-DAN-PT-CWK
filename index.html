        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-0.1584167273571588,110.39300311236715],[-0.1384996626720796,110.41652450117508]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'

        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GOOGLESATELITE_0');

        function pop_Rev_Realisasi_CWK_Juli_Oktober_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Id'] !== null ? autolinker.link(String(feature.properties['Id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['luasan'] !== null ? autolinker.link(String(feature.properties['luasan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">BLOK</th>\
                        <td class="visible-with-data" id="BLOK">' + (feature.properties['BLOK'] !== null ? autolinker.link(String(feature.properties['BLOK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Vendor</th>\
                        <td class="visible-with-data" id="Vendor">' + (feature.properties['Vendor'] !== null ? autolinker.link(String(feature.properties['Vendor']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Bulan</th>\

                    </tr>\
                    <tr>\
                        <th scope="row">LUAS_HA</th>\

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

			layer.bindPopup(content, { maxHeight: 400 });
        }

        var pattern_Rev_Realisasi_CWK_Juli_Oktober_1_0 = new L.StripePattern({

        function style_Rev_Realisasi_CWK_Juli_Oktober_1_0() {
            return {

        function style_Rev_Realisasi_CWK_Juli_Oktober_1_1() {

                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',

                lineJoin: 'bevel',

        }
        map.createPane('pane_Rev_Realisasi_CWK_Juli_Oktober_1');
        map.getPane('pane_Rev_Realisasi_CWK_Juli_Oktober_1').style.zIndex = 401;
        map.getPane('pane_Rev_Realisasi_CWK_Juli_Oktober_1').style['mix-blend-mode'] = 'normal';
        var layer_Rev_Realisasi_CWK_Juli_Oktober_1 = new L.geoJson.multiStyle(json_Rev_Realisasi_CWK_Juli_Oktober_1, {
            attribution: '',

        bounds_group.addLayer(layer_Rev_Realisasi_CWK_Juli_Oktober_1);
        map.addLayer(layer_Rev_Realisasi_CWK_Juli_Oktober_1);
        function pop_Update_Real_Tanam_2(feature, layer) {
            var popupContent = '<table>\

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

        var pattern_Update_Real_Tanam_2_0 = new L.StripePattern({

        }
        map.createPane('pane_Update_Real_Tanam_2');
        map.getPane('pane_Update_Real_Tanam_2').style.zIndex = 402;
        map.getPane('pane_Update_Real_Tanam_2').style['mix-blend-mode'] = 'normal';
        var layer_Update_Real_Tanam_2 = new L.geoJson.multiStyle(json_Update_Real_Tanam_2, {

        bounds_group.addLayer(layer_Update_Real_Tanam_2);

        var overlaysTree = [
            {label: '<img src="legend/Update_Real_Tanam_2.png" /> Update_Real_Tanam', layer: layer_Update_Real_Tanam_2},
            {label: '<img src="legend/Rev_Realisasi_CWK_Juli_Oktober_1.png" /> Rev_Realisasi_CWK_Juli_Oktober', layer: layer_Rev_Realisasi_CWK_Juli_Oktober_1},

        var lay = L.control.layers.tree(null, overlaysTree,{

            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_Rev_Realisasi_CWK_Juli_Oktober_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_Rev_Realisasi_CWK_Juli_Oktober_1_eval_expression(context) !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + exp_label_Rev_Realisasi_CWK_Juli_Oktober_1_eval_expression(context)).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Rev_Realisasi_CWK_Juli_Oktober_1'});
            labels.push(layer);

              layer.added = true;

        var i = 0;

            var context = {

            };
            layer.bindTooltip((exp_label_Update_Real_Tanam_2_eval_expression(context) !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + exp_label_Update_Real_Tanam_2_eval_expression(context)).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Update_Real_Tanam_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;

              i++;
        });
        resetLabels([layer_Rev_Realisasi_CWK_Juli_Oktober_1,layer_Update_Real_Tanam_2]);
        map.on("zoomend", function(){

        });
        map.on("layeradd", function(){
